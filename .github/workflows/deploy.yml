name: Build and Deploy

on:
  push:
    branches:
      - main
  # Build (but don't deploy) every pull request, so a broken build is caught before merge.
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
          # Keep dist/.nojekyll: without it GitHub Pages runs Jekyll, which drops
          # the _astro/ folder (CSS, JS and images) because it starts with "_".
          include-hidden-files: true

      - name: Check the built site is GitHub Pages-ready
        run: |
          test -f dist/.nojekyll || { echo "dist/.nojekyll is missing"; exit 1; }
          test -d dist/assets || { echo "dist/assets is missing"; exit 1; }
          if find dist -name '_*' | grep -q .; then echo "Paths starting with _ would be dropped by Jekyll:"; find dist -name '_*'; exit 1; fi

  deploy:
    # Publishes to the gh-pages branch, the same branch GitHub Pages serves today,
    # so no repository settings need to change.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Check .nojekyll survived the artifact
        run: test -f dist/.nojekyll || { echo "dist/.nojekyll is missing"; exit 1; }

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          single-commit: true
