name: Build and Deploy

on:
  push:
    branches:
      - main
  # No pull_request trigger: nothing runs when a PR is opened or updated.
  workflow_dispatch:

# Read-only by default; only the deploy job gets write access.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a production deploy halfway: queue the next one instead, or a
  # later failing build would leave the site on an older version.
  cancel-in-progress: false

env:
  SITE_URL: https://nobodyme.github.io/blog/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Don't leave the token in .git/config while dependency code runs.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the build has .nojekyll
        # Without it GitHub Pages runs Jekyll, which silently drops files and folders
        # whose names start with "_" (that is how the site lost its CSS once).
        run: test -f dist/.nojekyll || { echo "dist/.nojekyll is missing"; exit 1; }

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7
          # upload-artifact skips dotfiles by default, which would drop .nojekyll.
          include-hidden-files: true

  deploy:
    # Publishes to the gh-pages branch, which GitHub Pages serves.
    # Manual runs from other branches only build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Check .nojekyll survived the artifact
        run: test -f dist/.nojekyll || { echo "dist/.nojekyll is missing"; exit 1; }

      - name: Deploy
        # Pinned to a commit because this third-party action runs with write access.
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          single-commit: true

  verify-live:
    # GitHub Pages can report success while serving a broken site, so check what
    # visitors actually get once the new version is live.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Wait for the new version and check its assets load
        run: |
          set -euo pipefail
          origin="${SITE_URL%%/blog/*}"
          # Every same-site asset the home page references (CSS, JS, icons, manifest).
          assets=()
          while IFS= read -r path; do assets+=("$path"); done < <(
            grep -oE '(href|src)="/blog/[^"#?]+\.(css|js|png|svg|webp|ico|webmanifest)"' dist/index.html \
              | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          css=$(printf '%s\n' "${assets[@]}" | grep -m1 '\.css$') || { echo "No stylesheet found in dist/index.html"; exit 1; }
          echo "Waiting for ${SITE_URL} to reference ${css}"
          for attempt in $(seq 1 60); do
            if curl -fsSL "${SITE_URL}?v=${GITHUB_SHA}" | grep -qF "${css}"; then
              echo "New version is live (attempt ${attempt})"
              break
            fi
            if [ "$attempt" = 60 ]; then echo "The live site never served the new build"; exit 1; fi
            sleep 10
          done
          failed=0
          for path in "${assets[@]}" /blog/rss.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${origin}${path}")
            echo "${code} ${path}"
            [ "$code" = 200 ] || failed=1
          done
          exit "$failed"
